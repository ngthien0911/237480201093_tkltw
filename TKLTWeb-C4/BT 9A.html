<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script language = "JavaScript">
    var SoLuong, x;
    var DS = new Array(100);
    SoLuong = prompt("Bạn cần nhập bao nhiu người: ", 5);
    for (i=0;i<SoLuong;i++)
    {
        DS[i] = prompt("Nhập vào họ tên:  ", "");
    }

    DS.sort();
    document.write("<h1> Danh sách đã được sắp xếp </h1>");
    for (x in DS )
    {
        document.write(DS[x]);
        document.write("<br>");
    }
    </script>
</body>
</html>
