<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <Script language = "JavaScript">
        var LuaChon;
        LuaChon = prompt("Bạn hãy nhập vào 1 số để mở trang web: ","1");
        switch (LuaChon)
        {
            case "1": window.open("http://www.google.com");
            break;
            case "2": window.open("http://www.facebook.com");
            break;
            case "3": window.open("http://www.youtube.com");
            break;
           
            default: window.open ("http://www.blu.edu.vn");
        }
    </Script>
</body>
</html>
