<!DOCTYPE html>
<html>
<head>
<title>Hiển thị họ và tên</title>
<meta charset="utf-8">
</head>

<body>

<h2>Nhập họ và tên</h2>

Họ:
<input type="text" name="Ho">

<br><br>

Tên:
<input type="text" name="Ten">

<br><br>

Họ và tên:
<input type="text" name="HoTen">

<br><br>

<input type="button" name="HienThi" value="Hiển thị"
onclick="HoTen.value = Ho.value + ' ' + Ten.value">

</body>
</html>
