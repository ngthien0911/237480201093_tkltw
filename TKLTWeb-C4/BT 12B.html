<!DOCTYPE html>
<html>
<head>
<title>Đọc giá trị textbox</title>
<meta charset="utf-8">
</head>

<body>

<h2>Nhập thông tin và bấm Hiển thị</h2>

Họ tên:
<input type="text" id="HoTen">

<br><br>

Năm sinh:
<input type="text" id="NamSinh">

<br><br>

<input type="button" value="Hiển thị"
onclick="document.write('Họ tên: ' + HoTen.value + '<br>Năm sinh: ' + NamSinh.value)">

</body>
</html>
