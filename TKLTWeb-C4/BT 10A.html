<html>
<head>
<title>Minh họa đưa câu lệnh JavaScript vào các phần tử</title>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
</head>

<body>

<h3>Ví dụ Button JavaScript</h3>

<input type="button" value="Hello world"
onclick="alert('Hello world');">

<br><br>

<input type="button" value="Welcome JavaScript"
onclick="document.write('Welcome to JavaScript');">

<br><br>

<input type="button" value="Thông báo đăng ký"
onclick="alert('Dang ky E-Mail');">

<br><br>

<input type="button" value="Tính tổng"
onclick="var x,y; x=10; y=20; alert('Tổng là: ' + (x+y));">

<br><br>

<input type="button" value="Nhiều câu lệnh"
onclick="alert('Xin chào'); alert('Bạn đang học JavaScript');">

</body>
</html>
