<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tính toán cơ bản</title>
</head>
<body>

<h2>Nhập 2 số để tính toán</h2>

<input type="text" id="a" placeholder="Nhập số thứ nhất"><br>
<input type="text" id="b" placeholder="Nhập số thứ hai"><br>
<input type="text" id="kq" placeholder="Kết quả" readonly><br><br>

<button onclick="tinhToan('cong')">Cộng</button>
<button onclick="tinhToan('tru')">Trừ</button>
<button onclick="tinhToan('nhan')">Nhân</button>
<button onclick="tinhToan('chia')">Chia</button>

<script>
function tinhToan(phep) {
    let so1 = parseFloat(document.getElementById("a").value);
    let so2 = parseFloat(document.getElementById("b").value);
    let ketQua;

    // kiểm tra nhập số
    if (isNaN(so1) || isNaN(so2)) {
        alert("Vui lòng nhập số hợp lệ!");
        return;
    }

    switch (phep) {
        case 'cong':
            ketQua = so1 + so2;
            break;
        case 'tru':
            ketQua = so1 - so2;
            break;
        case 'nhan':
            ketQua = so1 * so2;
            break;
        case 'chia':
            if (so2 === 0) {
                alert("Không thể chia cho 0!");
                return;
            }
            ketQua = so1 / so2;
            break;
    }

    document.getElementById("kq").value = ketQua;
}
</script>

</body>
</html>
