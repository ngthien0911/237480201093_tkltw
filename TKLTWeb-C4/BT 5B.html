<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script language = "JavaScript">
    var D = new Date();
    document.write( "Bây giờ là: " + D.getHours() + ":" + D.getMinutes() + ":" + D.getSeconds() + "s");
    document.write("<br>");  
    document.write("Hôm nay là ngày: " + D.getDate() +  "/" + (D.getMonth() + 1) + "/" + D.getFullYear());
    </script>
    
</body>
</html>
