<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="BAI20.CSS">
</head>
<body>
   <div class="container">

    <div class="header">Đăng nhập thành viên</div>

    <div class="form">

        <!-- Email -->
        <div class="group">
            
            <input type="text" placeholder="Email name">
            <span class="icon">💌</span>
            <span class="icon">@blu.edu.vn</span>
        </div>

        <!-- Password -->
        <div class="group">
            
            <input type="password" id="pass" placeholder="Password">
            <span class="icon">🔒</span>
            <span class="show-btn" onclick="togglePass()">Hiện</span>
        </div>

        <!-- Mã số -->
        <div class="group">
            <input type="text" placeholder="Mã số">
            <span class="barcode">|||||</span>
        </div>

        <button>Đăng nhập</button>
        <button>Đăng ký</button>

    </div>
</div>


</body>
</html>
